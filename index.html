<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tripsi — wspólne wydatki z wyjazdu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f7f7fb;--c:#fff;--tx:#15152b;--mu:#6e6e88;--bd:#ececf4;--ac:#5b4bff;--acs:#efedff;--g:#0f9d6b;--gs:#e5f6ef;--r:#e5484d;--rs:#fdecec;--sh:0 1px 2px rgba(21,21,43,.04),0 10px 30px rgba(21,21,43,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e18;--c:#171724;--tx:#f1f1f8;--mu:#9a9ab5;--bd:#27273b;--acs:#25224f;--gs:#10281f;--rs:#2d1618;--ac:#7c6dff}}
:root[data-theme=dark]{--bg:#0e0e18;--c:#171724;--tx:#f1f1f8;--mu:#9a9ab5;--bd:#27273b;--acs:#25224f;--gs:#10281f;--rs:#2d1618;--ac:#7c6dff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}h1,h2,h3{letter-spacing:-.03em;line-height:1.1}
.w{max-width:1040px;margin:0 auto;padding:20px 20px 110px}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}.g{color:var(--g)}.rd{color:var(--r)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:18px}
.btn{border:1px solid var(--bd);background:var(--c);border-radius:14px;padding:11px 18px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.big{padding:15px 26px;font-size:16px;border-radius:16px}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.d{color:var(--r)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.04em;display:flex;gap:8px;align-items:center}.logo i{width:28px;height:28px;border-radius:9px;background:var(--ac);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}.av.l{width:52px;height:52px;font-size:19px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tc{padding:0;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;width:100%}.tc:hover{transform:translateY(-3px)}.tc .top{height:92px;display:grid;place-items:center;font-size:42px}.tc .bd{padding:16px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--acs);color:var(--ac)}.pill.g{background:var(--gs);color:var(--g)}.pill.r{background:var(--rs);color:var(--r)}
.seg{display:flex;gap:4px;background:var(--acs);padding:4px;border-radius:14px;overflow-x:auto}.seg button,.seg label{flex:1;border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap;text-align:center}.seg .on,.seg label:has(input:checked){background:var(--c);color:var(--tx);box-shadow:var(--sh)}.seg input{display:none}
.big-n{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.04em}
.item{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}.item:last-child{border:0}.item .ic{width:44px;height:44px;border-radius:14px;background:var(--acs);display:grid;place-items:center;font-size:22px;flex:none}.item .m{flex:1;min-width:0}.item b{display:block}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select{border:1px solid var(--bd);background:var(--c);border-radius:12px;padding:10px 12px;width:100%;min-width:0}.fl>*{flex:1;min-width:120px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu)}label input,label select{margin-top:5px;color:var(--tx);font-weight:500}.lb{font-size:13px;font-weight:600;color:var(--mu);margin:14px 0 6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(15,15,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .2s}.md{background:var(--c);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}.md h2{font-size:22px;margin-bottom:12px}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:24px}}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes pop{0%{background:var(--acs)}100%{background:transparent}}@keyframes sk{50%{opacity:.4}}
.new{animation:pop 1.8s}.skel{height:210px;border-radius:20px;background:var(--bd);animation:sk 1s infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip input{display:none}.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--bd);border-radius:99px;font-size:13px;font-weight:600;color:var(--tx);cursor:pointer}.chip input:checked+span{background:var(--ac);border-color:var(--ac);color:#fff}
.pr{display:flex;align-items:center;gap:8px;padding:6px 0}.pc{display:flex!important;align-items:center;gap:8px;flex:1;color:var(--tx)!important}.pc input{width:auto;margin:0}.pv{width:80px!important}.ps{min-width:70px;text-align:right;font-weight:700;font-size:13px}.hint{font-size:13px;margin:8px 0;font-weight:600}
.acts{display:flex;gap:10px;margin-top:18px}.acts .btn{flex:1}
.bnav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--mu);gap:2px;cursor:pointer;padding:4px 10px}.bnav span{font-size:20px}.bnav .on{color:var(--ac)}.bnav .plus{background:var(--ac);color:#fff;border-radius:50%;width:52px;height:52px;margin-top:-22px;justify-content:center;box-shadow:0 8px 20px rgba(91,75,255,.4)}.bnav .plus span{font-size:26px}
@media(min-width:800px){.bnav{display:none}.w{padding-bottom:50px}}@media(max-width:799px){.hd{display:none!important}}
#t{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:99;pointer-events:none}.toast{background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:16px;box-shadow:var(--sh);animation:up .3s;max-width:92vw}
.hero{padding:60px 0 40px;display:grid;gap:40px;grid-template-columns:1.1fr .9fr;align-items:center}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:30px}}
.hero h1{font-size:clamp(38px,7vw,68px);font-weight:800}.hero p{font-size:18px;color:var(--mu);margin:18px 0 26px;max-width:480px}
.bar{height:10px;border-radius:99px;background:var(--acs);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.flow{text-align:center;padding:16px;border:1px solid var(--bd);border-radius:18px;background:var(--bg);margin-bottom:12px}.flow .ar{font-size:22px;color:var(--ac);font-weight:800;margin:4px 0}
.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;display:grid;place-items:center}.donut div{width:94px;height:94px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800;text-align:center;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const RATES={PLN:1,EUR:4.25,USD:3.9,GBP:4.95,CZK:.17,HUF:.0108}; // kursy względem PLN — wymień na API kursów
const CATS={food:['🍔','Jedzenie'],transport:['🚗','Transport'],stay:['🏨','Nocleg'],fun:['🎟️','Atrakcje'],shop:['🛒','Zakupy'],party:['🍹','Rozrywka'],other:['💳','Inne']};
const COL=['#5b4bff','#0f9d6b','#f59e0b','#e5484d','#06b6d4','#ec4899','#8b5cf6'],GR=[['#5b4bff','#a99bff'],['#0ea5e9','#7dd3fc'],['#10b981','#86efac'],['#f59e0b','#fde68a'],['#ec4899','#f9a8d4']];
let S;try{S=JSON.parse(localStorage.getItem('tripsi'))}catch(e){}S=S||{user:null,trips:[],notifs:[]};
const V={view:S.user?'dash':'landing',tab:'exp',tid:null,q:'',who:'',cat:'',sort:'new',st:'cat',auth:'reg',load:0,rcp:null,newId:null};
const save=()=>{try{localStorage.setItem('tripsi',JSON.stringify(S))}catch(e){}};
const T=()=>S.trips.find(t=>t.id===V.tid)||S.trips[0],me=t=>t.members.find(m=>m.uid===S.user.id)||t.members[0];
const money=(c,cur)=>{try{return(c/100).toLocaleString('pl-PL',{style:'currency',currency:cur||'PLN'})}catch(e){return(c/100).toFixed(2)+' '+cur}};
const dt=d=>new Date(d).toLocaleDateString('pl-PL',{day:'numeric',month:'long'}),today=()=>new Date().toISOString().slice(0,10),sum=a=>a.reduce((x,y)=>x+y,0);
const mem=(t,id)=>t.members.find(m=>m.id===id)||{name:'?'},av=(t,id,c='')=>{const i=Math.max(0,t.members.findIndex(m=>m.id===id));return`<span class="av ${c}" style="background:${COL[i%7]}">${esc(mem(t,id).name[0]||'?').toUpperCase()}</span>`};
const base=(e,t)=>Math.round(e.amount*(RATES[e.currency]||1)/(RATES[t.currency]||1));
function alloc(b,w){const tot=sum(w);if(tot<=0)return w.map(()=>0);const raw=w.map(x=>b*x/tot),f=raw.map(Math.floor);let rem=b-sum(f);raw.map((x,i)=>[x-f[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rem>0){f[i]++;rem--}});return f}
function shares(e,t){return alloc(base(e,t),e.participants.map(i=>e.splitType==='equal'?1:(e.vals[i]||0)))}
function calc(t){const paid={},owed={},bal={};t.members.forEach(m=>paid[m.id]=owed[m.id]=0);
t.expenses.forEach(e=>{paid[e.paidBy]+=base(e,t);shares(e,t).forEach((s,k)=>owed[e.participants[k]]+=s)});
t.members.forEach(m=>bal[m.id]=paid[m.id]-owed[m.id]);t.settlements.forEach(s=>{bal[s.from]+=s.amount;bal[s.to]-=s.amount});return{paid,owed,bal}}
function suggest(bal){const d=[],c=[];for(const k in bal){if(bal[k]<-1)d.push([k,-bal[k]]);else if(bal[k]>1)c.push([k,bal[k]])}
d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const r=[];let i=0,j=0;while(i<d.length&&j<c.length){const x=Math.min(d[i][1],c[j][1]);r.push({from:d[i][0],to:c[j][0],amount:x});d[i][1]-=x;c[j][1]-=x;if(d[i][1]<=1)i++;if(c[j][1]<=1)j++}return r}
const total=t=>sum(t.expenses.map(e=>base(e,t)));
function note(x){S.notifs.unshift({t:x,at:Date.now()});S.notifs=S.notifs.slice(0,30)}
function toast(a,b){$('#t').innerHTML=`<div class="toast"><b>${a}</b>${b?`<div style="opacity:.8;font-size:13px">${b}</div>`:''}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>$('#t').innerHTML='',2800)}
function M(h){$('#m').innerHTML=h?`<div class="ov" data-a="ov"><div class="md">${h}</div></div>`:''}
function seed(){const m=[['m1','Wiktor','u1'],['m2','Kuba'],['m3','Bartek'],['m4','Michał']].map(([id,name,u])=>({id,name,uid:u,email:name.toLowerCase().replace('ł','l')+'@mail.pl'})),A=['m1','m2','m3','m4'];
const x=(title,amount,currency,paidBy,participants,category,date,splitType='equal',vals={})=>({id:uid(),title,amount,currency,paidBy,participants,splitType,vals,category,date,receipt:null,notes:''});
S.user={id:'u1',name:'Wiktor',email:'wiktor@mail.pl',cur:'PLN',notif:{exp:1,debt:1,pay:1}};
S.trips=[{id:'praga',name:'Majówka w Pradze',emoji:'🇨🇿',location:'Praga, Czechy',startDate:'2026-05-01',endDate:'2026-05-04',currency:'PLN',code:'TRIP-7K92',members:m,
expenses:[x('Apartament na Starém Městě',120000,'PLN','m1',A,'stay','2026-05-01'),x('Paliwo i autostrada',34000,'PLN','m1',A,'transport','2026-05-01'),x('Piwo w Pivnici',165000,'CZK','m2',A,'party','2026-05-02'),x('Bilety na komunikację',9600,'PLN','m3',A,'transport','2026-05-02'),x('Zamek Praski',18000,'PLN','m4',['m1','m2','m4'],'fun','2026-05-03'),x('Kolacja w Lokál',36000,'PLN','m3',A,'food','2026-05-03','custom',{m1:100,m2:80,m3:90,m4:90}),x('Zakupy Albert',8490,'PLN','m4',A,'shop','2026-05-04')],
settlements:[{id:uid(),from:'m2',to:'m1',amount:5000,method:'BLIK',date:'2026-05-03',status:'done'}]}];
S.notifs=[{t:'Kuba dodał wydatek 280 zł',at:Date.now()-36e5},{t:'Kuba oznaczył przelew jako wykonany',at:Date.now()-72e5}];V.tid='praga';V.view='dash';startLoad();save()}
function startLoad(){V.load=1;setTimeout(()=>{V.load=0;render()},600)}
/* ---------- widoki ---------- */
const logo=`<div class="logo"><i>✈</i>Tripsi</div>`;
function landing(){return`<div class="w"><div class="row sp">${logo}<div class="row"><button class="btn" data-a="auth" data-m="in">Zaloguj</button><button class="btn p hd" data-a="auth" data-m="reg">Stwórz wyjazd</button></div></div>
<div class="hero"><div><h1>Ogarnijcie wydatki z wyjazdu. Bez liczenia na kalkulatorze.</h1><p>Dodawaj wydatki, dziel rachunki między znajomych i zawsze wiesz, kto komu ile powinien oddać.</p><div class="row" style="flex-wrap:wrap"><button class="btn p big" data-a="auth" data-m="reg">Stwórz wyjazd</button><button class="btn big" data-a="how">Zobacz jak działa</button></div></div>
<div class="card" style="padding:22px"><div class="row sp"><b style="font-size:18px">🇨🇿 Majówka w Pradze</b><span class="pill">4 osoby</span></div><div class="mu">1–4 maja 2026</div><div class="big-n" style="margin:14px 0 2px">2 456 zł</div><div class="mu">łączne wydatki</div>
<div class="row" style="margin:16px 0">${['W','K','B','M'].map((l,i)=>`<span class="av" style="background:${COL[i]};margin-right:-14px;border:2px solid var(--c)">${l}</span>`).join('')}<span class="pill g" style="margin-left:22px">Otrzymasz 340 zł</span></div>
<div class="flow"><div class="row sp"><b>Bartek</b><b>Wiktor</b></div><div class="ar">→ 250 zł</div></div><div class="flow" style="margin:0"><div class="row sp"><b>Michał</b><b>Kuba</b></div><div class="ar">→ 100 zł</div></div></div></div>
<div id="how" class="grid" style="padding-top:30px">${[['💸','Dodaj wydatek w kilka sekund','Kwota, kto zapłacił i kto korzystał. Domyślnie po równo, ale możesz podzielić też kwotami, procentami lub udziałami.'],['🧮','Salda liczą się same','Aplikacja na bieżąco zlicza, kto wydał, ile powinien ponieść i jakie ma saldo.'],['🤝','Minimum przelewów','Zamiast wielu przekazów dostajecie krótką listę „kto komu” i odhaczacie ją gotówką, przelewem lub BLIK-iem.']].map(([e,a,b])=>`<div class="card"><div style="font-size:30px">${e}</div><h3 style="margin:10px 0 6px;font-size:19px">${a}</h3><p class="mu">${b}</p></div>`).join('')}</div>
<div style="text-align:center;margin-top:34px"><button class="btn big" data-a="demo">Wypróbuj demo z Pragą</button></div></div>`}
function auth(){const r=V.auth==='reg';return`<div class="w" style="max-width:420px;padding-top:60px"><div style="margin-bottom:26px" class="row sp">${logo}<button class="btn sm" data-a="go" data-v="landing">Wróć</button></div><div class="card"><h2 style="font-size:28px;margin-bottom:6px">${r?'Załóż konto':'Witaj ponownie'}</h2><p class="mu" style="margin-bottom:14px">${r?'Zajmie to chwilę.':'Zaloguj się, aby wrócić do wyjazdów.'}</p>
<form id="af">${r?'<label>Imię<input name="n" required placeholder="Wiktor"></label>':''}<div style="margin-top:10px"><label>Email<input name="e" type="email" required placeholder="ty@mail.pl"></label></div><div style="margin-top:10px"><label>Hasło<input name="p" type="password" required minlength="4"></label></div><button class="btn p big" style="width:100%;margin-top:18px">${r?'Załóż konto':'Zaloguj się'}</button></form>
<button class="btn" style="width:100%;margin-top:10px" data-a="demo">Wejdź jako demo</button><p class="mu" style="text-align:center;margin-top:14px"><a href="#" data-a="auth" data-m="${r?'in':'reg'}" style="color:var(--ac);font-weight:600">${r?'Masz już konto? Zaloguj się':'Nie masz konta? Zarejestruj się'}</a></p></div></div>`}
const tripCard=(t,i)=>{const b=calc(t).bal[me(t).id],g=GR[i%5];return`<button class="card tc" data-a="trip" data-id="${t.id}"><div class="top" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${t.emoji}</div><div class="bd"><div class="row sp"><b style="font-size:17px">${esc(t.name)}</b></div><div class="mu">${dt(t.startDate)} – ${dt(t.endDate)}</div><div class="mu" style="margin:6px 0">${t.members.length} os. · ${t.expenses.length} wydatków · ${money(total(t),t.currency)}</div><span class="pill ${b>1?'g':b<-1?'r':''}">Twoje saldo: ${b>0?'+':''}${money(b,t.currency)}</span></div></button>`};
function head(){return`<div class="row sp" style="margin-bottom:22px">${V.view==='trip'?`<button class="btn sm" data-a="go" data-v="dash">← Wyjazdy</button>`:logo}<div class="row"><button class="btn sm" data-a="notifs" aria-label="Powiadomienia">🔔${S.notifs.length?` ${S.notifs.length}`:''}</button><button data-a="profile" style="border:0;background:none;cursor:pointer" aria-label="Profil"><span class="av" style="background:var(--ac)">${esc(S.user.name[0]).toUpperCase()}</span></button></div></div>`}
function dash(){return`<div class="w">${head()}<div class="row sp" style="margin-bottom:22px;flex-wrap:wrap"><div><h1 style="font-size:clamp(28px,5vw,40px)">Cześć, ${esc(S.user.name)} 👋</h1><p class="mu" style="font-size:16px;margin-top:4px">Co dziś rozliczamy?</p></div><button class="btn p hd" data-a="newtrip">+ Nowy wyjazd</button></div>
<h3 style="font-size:18px;margin-bottom:12px">Moje wyjazdy</h3>${V.load?`<div class="grid"><div class="skel"></div><div class="skel"></div></div>`:S.trips.length?`<div class="grid">${S.trips.map(tripCard).join('')}</div>`:`<div class="card" style="text-align:center;padding:44px 20px"><div style="font-size:44px">🧳</div><h3 style="margin:10px 0 6px">Nie masz jeszcze wyjazdów</h3><p class="mu" style="margin-bottom:16px">Stwórz pierwszy wyjazd albo zobacz gotowy przykład.</p><button class="btn p" data-a="newtrip">+ Nowy wyjazd</button> <button class="btn" data-a="demo">Załaduj demo</button></div>`}</div>`}
function tripV(){const t=T();if(!t)return dash();const c=calc(t),m=me(t),b=c.bal[m.id];
return`<div class="w">${head()}<div class="row sp" style="flex-wrap:wrap;gap:16px"><div><h1 style="font-size:clamp(28px,5vw,40px)">${t.emoji} ${esc(t.name)}</h1><p class="mu" style="margin-top:6px">${dt(t.startDate)} – ${dt(t.endDate)} · ${t.members.length} uczestników</p></div><div class="row hd"><button class="btn" data-a="invite">Zaproś znajomych</button><button class="btn p" data-a="add">+ Dodaj wydatek</button></div></div>
